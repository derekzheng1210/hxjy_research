<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 内部研究工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.panel{width:min(380px,calc(100vw - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.08)}h1{font-size:20px;margin:0 0 6px}.sub{font-size:13px;color:#6b7280;margin-bottom:22px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;height:40px;border:1px solid #d1d5db;border-radius:6px;padding:0 12px;font-size:14px}input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}button{width:100%;height:40px;margin-top:16px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:6px;padding:9px 10px;font-size:13px;margin-bottom:14px}.hint{font-size:12px;color:#9ca3af;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<form class="panel" method="post">
  <h1>内部研究工作台</h1>
  <div class="sub">请输入访问密码后继续</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="password">访问密码</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
  <button type="submit">登录</button>
  <div class="hint">仅限内部使用</div>
</form>
</body>
</html>
