<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>经纪商数据</title>
<script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='broker_data.css', v='20261030-1') }}">
</head>
<body><main class="page">
<header class="header"><h1>经纪商数据</h1><span class="badge">挂盘情绪 × 成交方向 × 曲线利差</span><a href="{{ url_for('secondary_bond_picker') }}">返回二级择券 ↗</a><button id="refresh" class="btn">刷新数据</button></header>
<div id="error" class="notice error" role="alert" hidden></div>
<section class="card filters"><div class="filter-row"><label for="scope">观察券池</label><select id="scope"><option value="all">全部券种</option><option value="tier2">二级资本债</option></select><span class="muted">挂盘按择券券池；成交为DM盘面日报全市场口径</span></div>
<div class="filter-row"><label>历史区间</label><div id="ranges"><button data-days="30">近1月</button><button data-days="90" class="on">近3月</button><button data-days="180">近6月</button></div><input id="start" type="date" aria-label="开始日期"><span>至</span><input id="end" type="date" aria-label="结束日期"><button id="apply" class="btn ghost">应用</button></div>
<div class="filter-row meta" id="freshness">正在读取数据…</div></section>
<section class="card"><div class="card-head"><h2>情绪与价格联动</h2><span class="muted">同日最后一次情绪快照 · 独立纵轴</span></div>
<div class="toolbar"><label>观察指标 <select id="metric"><option value="tkn_pct" selected>TKN占比（%）</option><option value="gvn_pct">GVN占比（%）</option><option value="emotion">报价均值偏离（BP）</option><option value="num">成交笔数（盘面日报）</option><option value="net">TKN−GVN（笔）</option></select></label><label>叠加 <select id="mode"><option value="both">收益率 + 利差</option><option value="yield">收益率</option><option value="spread">利差</option><option value="none">不叠加</option></select></label><label>曲线 <select id="curve"></select></label><label>期限 <select id="tenor"></select></label><span id="overlayStatus" class="muted"></span></div>
<div class="toolbar processing"><label>平滑 <select id="smooth"><option value="none">原始数据</option><option value="ma5">MA5</option><option value="ma10">MA10</option><option value="ma20">MA20</option><option value="ema5">EMA5</option><option value="ema10">EMA10</option><option value="ema20">EMA20</option></select></label><label>数据处理 <select id="transform"><option value="level">原始水平</option><option value="diff">一阶变化量</option><option value="z20">滚动20期 Z-score</option></select></label><label>领先性平移 <select id="shift"><option value="0" selected>不平移</option><option value="L1">指标领先1日</option><option value="L2">领先2日</option><option value="L3">领先3日</option><option value="L5">领先5日</option><option value="L10">领先10日</option><option value="L15">领先15日</option><option value="L20">领先20日</option><option value="G1">指标滞后1日</option><option value="G2">滞后2日</option><option value="G3">滞后3日</option><option value="G5">滞后5日</option><option value="G10">滞后10日</option><option value="G15">滞后15日</option><option value="G20">滞后20日</option></select></label><span class="color-group" title="调整各序列颜色，本地记忆"><label class="cg"><input type="color" id="colorSignal"><span>指标</span></label><label class="cg"><input type="color" id="colorYield"><span>收益率</span></label><label class="cg"><input type="color" id="colorSpread"><span>利差</span></label><button id="resetColors" class="btn ghost" type="button">默认配色</button></span><span class="muted" id="processingStatus">各序列按自身有效观测日计算，窗口不足留空</span></div>
<div class="toolbar draw-tools"><span class="bar-label">辅助线</span><button id="drawTrend" class="ghost-toggle" type="button">趋势线</button><button id="drawHline" class="ghost-toggle" type="button">水平线</button><button id="drawErase" class="ghost-toggle" type="button">删除线</button><label>对齐轴 <select id="drawAxis"></select></label><button id="undoLine" class="btn ghost" type="button">撤销</button><button id="clearLines" class="btn ghost" type="button">清空</button><label class="chk"><input type="checkbox" id="showLines" checked> 显示</label><span id="drawStatus" class="muted">在图上点击取点：趋势线两点、水平线一点，按当前配置记忆</span></div>
<div class="chart-wrap"><div id="mainChart" class="chart" role="img" aria-label="经纪商指标与收益率利差时间序列"></div><canvas id="drawLayer"></canvas></div><p class="footnote" id="chartNote"></p></section>
<div class="two-col"><section class="card"><div class="card-head"><h2>主动方向与成交活跃度</h2><span class="muted">DM盘面日报 · 日度 · 周末不展示</span></div><div id="directionChart" class="chart small"></div></section><section class="card structure"><div class="card-head"><h2>报价偏离结构</h2><span class="muted">最新快照 · 按维度</span></div><div class="toolbar"><label>维度 <select id="dimension"><option value="implied_rating">隐含评级</option><option value="internal_rating">参考内评</option><option value="term">剩余期限</option><option value="bond_type">券种</option></select></label><label>指标 <select id="structureMetric"><option value="mid" selected>中枢偏离（BP）</option><option value="bid">Bid偏离（BP）</option><option value="ofr">Ofr偏离（BP）</option><option value="width">买卖价差（BP）</option><option value="coverage">双边覆盖率（%）</option></select></label><label>视图 <select id="structureView"><option value="snapshot" selected>最新快照</option><option value="trend">区间趋势</option></select></label><span id="structureStatus" class="muted"></span></div><div id="structureChart" class="chart small"></div><p class="footnote">中枢与价差按有效双边逐券等权；Bid/Ofr 偏离含单边有效报价；覆盖率为有效双边券数占池内券数。趋势视图为逐日同口径中枢偏离（历史保留近60个交易日）。</p></section></div>

</main><script src="{{ url_for('static', filename='broker_series.js', v='20261029-2') }}"></script><script src="{{ url_for('static', filename='broker_data.js', v='20261030-1') }}"></script></body></html>
