<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公允估值观察</title><link rel="stylesheet" href="{{ url_for('static',filename='fair_value_observation/page.css') }}?v=20260918"></head><body>
<main><header><div><h1>公允估值观察 <small>测试阶段</small></h1><p id="latest-date">正在读取最新可用预测…</p></div><div class="date-controls"><button id="older" title="前一个预测日期">‹</button><select id="date" aria-label="预测日期"></select><button id="newer" title="后一个预测日期">›</button><button id="latest">最新</button><span id="cohort" class="tag"></span></div></header>
<div id="error" role="alert" hidden></div><div class="workspace">
<aside id="filters"><div class="filter-heading"><b>筛选债券</b><button id="reset" class="plain">重置</button></div>
<label>代码、简称或主体<input id="search" placeholder="搜索债券或发行人"></label>
<div class="ms-field"><span>隐含评级</span><div class="ms-wrap" id="ms_rating"><div class="ms-display"><span class="ms-placeholder">全部</span></div><div class="ms-drop" id="drop-ms_rating"></div></div></div>
<div class="ms-field"><span>参考内评</span><div class="ms-wrap" id="ms_internal_rating"><div class="ms-display"><span class="ms-placeholder">全部</span></div><div class="ms-drop" id="drop-ms_internal_rating"></div></div></div>
<div class="ms-field"><span>主体性质</span><div class="ms-wrap" id="ms_entity"><div class="ms-display"><span class="ms-placeholder">全部</span></div><div class="ms-drop" id="drop-ms_entity"></div></div></div>
<div class="pair"><label>城投债<select id="ct"><option value="">全部</option><option>是</option><option>否</option><option>未知</option></select></label><label>次级债<select id="sub"><option value="">全部</option><option>是</option><option>否</option><option>未知</option></select></label></div>
<label>交易场所<select id="market"><option value="">全部</option><option>银行间</option><option>交易所</option></select></label>
<label>剩余期限（年）<span class="pair"><input id="min_term" type="number" min="0" step=".1" placeholder="最短"><input id="max_term" type="number" min="0" step=".1" placeholder="最长"></span></label>
<label>官方估值收益率（%）<span class="pair"><input id="min_yield" type="number" step=".01" placeholder="最低"><input id="max_yield" type="number" step=".01" placeholder="最高"></span></label>
<button id="apply">筛选</button><p class="filter-note">下拉多选以标签显示已选项，点×移除；缺失历史属性显示“未知”。</p></aside>
<section class="results" id="results"><div id="loading" role="progressbar" aria-label="数据读取中"></div><div class="toolbar"><div class="tabs" aria-label="估值判断"><button class="active" data-direction="">全部</button><button data-direction="tighten">收益率偏高</button><button data-direction="widen">收益率偏低</button></div><button id="toggle-filters">筛选</button><div class="toolbar-right"><label>看后续<select id="horizon"><option value="5">5个交易日</option><option value="3">3个交易日</option><option value="10">10个交易日</option></select></label><a id="export">导出</a></div></div>
<div class="list-caption"><span id="count"></span><span>条件胜率不代表单券胜率，点击查看样本</span></div>
<div class="table-wrap"><table><thead><tr><th>债券简称</th><th><button data-sort="term">剩余期限 ↕</button></th><th>隐含评级</th><th>判断</th><th><button data-sort="yield">官方 → 公允收益率 ↕</button></th><th><button data-sort="adjustment">预计调整 ↕</button></th><th>命中条件历史胜率</th><th>后续表现</th><th></th></tr></thead><tbody id="bonds"></tbody></table></div>
<div class="pagination"><button id="prev-page">上一页</button><span id="page-info"></span><button id="next-page">下一页</button></div>
<details id="research"><summary>研究参考</summary><p>备选条件仍每日积累；以下为条件研究统计，不是单券胜率。小样本结果仅供观察。</p><div id="research-body"></div></details></section></div>
<footer>收益率偏高：预计下调；收益率偏低：预计上调。后续方向按利差变化判断。{% if is_admin %} <a href="/fair-value-observation/admin">数据管理</a>{% endif %}</footer></main>
<dialog id="detail"><div class="drawer-head"><div><h2 id="detail-title"></h2><span id="detail-subtitle"></span></div><button id="close-detail" aria-label="关闭走势图">✕</button></div><div id="detail-summary"></div><div class="chart-controls"><button class="active" data-chart="spread">利差走势</button><button data-chart="yield_value">收益率走势</button><span id="chart-note"></span></div><div id="chart" role="img" aria-label="实际走势与当时公允目标"></div><p class="chart-footnote">起点为当时可得的官方参考；虚线目标保持不变，缺失数据断开，未来日期不补造。</p><details id="conditions"><summary>判断依据与各条件胜率</summary><p id="rate-note"></p><div id="condition-table"></div></details></dialog>
<script src="{{ url_for('static',filename='vendor/echarts.min.js') }}"></script><script src="{{ url_for('static',filename='fair_value_observation/page.js') }}?v=20260918" defer></script></body></html>
