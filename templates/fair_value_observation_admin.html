<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>公允估值数据管理</title><link rel="stylesheet" href="/static/fair_value_observation/page.css"></head><body><main><h1>公允估值数据管理</h1><p><a href="/fair-value-observation">返回债券名单</a></p><pre id="jobs"></pre><button data-job="predict">重试当日预测</button> <button data-job="settle">更新兑现结果</button></main><script>
async function status(){let r=await fetch('/api/fair-value-observation/overview');let x=await r.json();document.getElementById('jobs').textContent=JSON.stringify(x.jobs||x,null,2);}document.querySelectorAll('[data-job]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{let r=await fetch('/api/fair-value-observation/retry',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({kind:b.dataset.job})});let x=await r.json();document.getElementById('jobs').textContent=x.message||x.error;}finally{b.disabled=false;}});status();
</script></body></html>
