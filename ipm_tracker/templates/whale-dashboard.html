                                <div class="ind-alerts">${x.red ? `<span class="r">🔴 ${x.red}</span> ` : ''}${x.yellow ? `<span class="y">🟡 ${x.yellow}</span>` : ''}${!x.red && !x.yellow ? '<span class="none">无异动</span>' : ''}</div>
                                <div class="ind-trend"><span class="up">↑${x.up}</span> / <span class="down">↓${x.down}</span> / →${x.flat}</div>
                                <div class="ind-fresh">本期更新 ${x.fresh} / ${x.total} 个指标</div>
                            </div>`).join('');
                    }
                    alRender();
                })
                .catch(e => {
                    const list = document.getElementById('alList');
                    if (list) { list.className = 'err'; list.textContent = '加载失败：' + e.message; }
                });
        }

        function alSetLevel(btn) {
            document.querySelectorAll('#alertsView .filter-btn[data-level]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            AL_LEVEL = btn.dataset.level;
            alRender();
        }
        function alToggleBatch() {
            AL_ONLY_BATCH = !AL_ONLY_BATCH;
            document.getElementById('alBatchBtn').classList.toggle('active', AL_ONLY_BATCH);
            alRender();
        }
        function alSetIndustry(name) {
            AL_INDUSTRY = name;   // '所有行业' 传 ''
            document.querySelectorAll('#alertsView .ind-card').forEach(c =>
                c.classList.toggle('active', c.dataset.name === AL_INDUSTRY));
            alRender();
        }

        function alSparkline(trend, dir) {
            if (!trend || trend.length < 2) return '';
            const w = 150, h = 36, pad = 2;
            const min = Math.min(...trend), max = Math.max(...trend);
            const span = (max - min) || 1;
            const pts = trend.map((v, i) => {
                const x = pad + i * (w - 2 * pad) / (trend.length - 1);
                const y = h - pad - (v - min) / span * (h - 2 * pad);
                return x.toFixed(1) + ',' + y.toFixed(1);
            }).join(' ');
            const color = dir === 'up' ? '#DC2626' : (dir === 'down' ? '#16A34A' : '#64748B');
            const last = pts.split(' ').pop().split(',');
            return `<svg class="spark" viewBox="0 0 ${w} ${h}">` +
                `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>` +
                `<circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`;
        }

        function alFmt(v, digits) {
            if (v === null || v === undefined) return '—';
            return Number(v).toLocaleString('zh-CN', { maximumFractionDigits: digits === undefined ? 2 : digits });
        }
        function alFmtInc(inc) {
            inc = String(inc || '');
            return inc.length === 8 ? inc.slice(0, 4) + '-' + inc.slice(4, 6) + '-' + inc.slice(6, 8) : inc;
        }

        function alAlertCard(a, i) {
            const dirCls = a.direction, dirArrow = a.direction === 'up' ? '↑' : (a.direction === 'down' ? '↓' : '→');
            const pctTxt = a.change_pct !== null ? ` (${a.change_pct > 0 ? '+' : ''}${alFmt(a.change_pct)}%)` : '';
            const stale = a.age_days !== null && a.age_days > 45 ? ` <span style="color:#D97706">（数据${a.age_days}天未更新）</span>` : '';
            const batchBadge = a.in_last_batch ? '<span class="batch-badge">本期</span>' : '';
            const sigRules = a.signals.map(s => {
                const d = alRuleDescOf(s);
                return d ? `<div class="sig-rule"><span class="sig-name">▸ ${s}</span><br><span class="rule-desc">规则：${d}</span></div>` : '';
            }).join('');
            return `<div class="card alert-card ${a.level}" id="alCard${i}" onclick="alToggle(${i})">
                <div class="alert-main">
                    <div class="level-dot ${a.level}"></div>
                    <div>
                        <div class="ind-name">${a.name}${batchBadge}</div>
                        <div class="ind-cat">${a['一级']} / ${a['二级']} · ${a.id}</div>
                    </div>
                    <div class="metric">
                        <div class="m-label">最新值（${a.latest_date}）</div>
                        <div class="m-value">${alFmt(a.latest)} ${a['单位'] || ''}${stale}</div>
                    </div>
                    <div class="metric">
                        <div class="m-label">较上期</div>
                        <div class="m-value ${dirCls}">${dirArrow} ${a.change > 0 ? '+' : ''}${alFmt(a.change)}${pctTxt}</div>
                    </div>
                    <div class="badges">${a.signals.map(s =>
                        `<span class="badge ${a.level === 'red' ? '' : 'soft'}">${s}</span>`).join('')}</div>
                    ${alSparkline(a.trend, a.direction)}
                    <div class="expand-icon">▶</div>
                </div>
                <div class="alert-detail">
                    <span class="kv">历史分位：<b>${alFmt(a.percentile, 1)}%</b></span>
                    <span class="kv">变动 Z-score：<b>${a.zscore > 0 ? '+' : ''}${alFmt(a.zscore)}</b></span>
                    <span class="kv">连续同向：<b>${a.streak} 期</b></span>
                    <span class="kv">得分：<b>${a.score}</b>（≥3 判红）</span>
                    <a class="detail-link" onclick="event.stopPropagation(); alGotoIndicator('${a.id}')">在景气面板中查看 →</a>
                    ${sigRules ? `<div class="sig-rules">${sigRules}</div>` : ''}
                </div>
            </div>`;
        }

        function alRender() {
            const sigSel = document.getElementById('alSigFilter');
            const list = document.getElementById('alList');
            if (!AL_DATA || !list) return;
            const sig = sigSel ? sigSel.value : '';

            const rows = AL_DATA.alerts.filter(a =>
                (AL_LEVEL === 'all' || a.level === AL_LEVEL) &&
                (!AL_INDUSTRY || a['一级'] === AL_INDUSTRY) &&
                (!AL_ONLY_BATCH || a.in_last_batch) &&
                (!sig || a.signals.some(s => s.includes(sig)))
            );

            if (!rows.length) {
                list.className = 'empty';
                list.innerHTML = AL_DATA.alerts.length ? '当前筛选条件下无异动指标' : '🎉 全部指标均在正常区间内，无异动';
                return;
            }
            list.className = '';

            const order = AL_DATA.industries.map(x => x.name);
            const groups = {};
            rows.forEach(a => {
                const k = a['一级'] || '未分类';
                (groups[k] = groups[k] || []).push(a);
            });
            const groupNames = Object.keys(groups).sort((x, y) =>
                (order.indexOf(x) === -1 ? 99 : order.indexOf(x)) - (order.indexOf(y) === -1 ? 99 : order.indexOf(y)));

            let idx = 0;
            list.innerHTML = groupNames.map(g => {
                const items = groups[g];
                const r = items.filter(a => a.level === 'red').length;
                const y = items.length - r;
                const header = `<div class="group-header"><h2>${g}</h2>
                    <span class="counts">${r ? `<span class="r">🔴 红 ${r}</span> · ` : ''}<span class="y">🟡 黄 ${y}</span> · 共 ${items.length} 个异动</span></div>`;
                const cards = items.map(a => alAlertCard(a, idx++)).join('');
                return header + cards;
            }).join('');
        }

        function alToggle(i) {
            document.getElementById('alCard' + i).classList.toggle('open');
        }

        // 从预警卡片跳回景气面板并定位到该指标
        function alGotoIndicator(id) {
            hideAlertsView();
            const row = document.querySelector(`.tree-row[data-id="${id}"]`);
            if (!row) return;
            let parent = row.parentElement;
            while (parent && parent.id !== 'treeContainer') {
                if (parent.classList.contains('tree-children')) {
                    parent.classList.add('expanded');
                    const parentRow = parent.previousElementSibling;
                    if (parentRow && parentRow.classList.contains('tree-row')) parentRow.classList.add('expanded');
                }
                parent = parent.parentElement;
            }
            row.click();
            // 只滚动左侧指标树容器，把行滚到树内居中（绝不滚动整个页面，避免页头移出视口）
            const tc = document.getElementById('treeContainer');
            if (tc) {
                const tcRect = tc.getBoundingClientRect();
                const rowRect = row.getBoundingClientRect();
                tc.scrollTop += (rowRect.top - tcRect.top) - tc.clientHeight / 2 + rowRect.height / 2;
            }
        }

        init();
    </script>

</body>
</html>
